<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototipe 3D Tumbler 750 ml</title>
<style>
  :root {
    --bg:#EFE6E0; --fg:#4A2423; --muted:#7d5c58; --line:#cdb8b0; --chip:#f8f1ed; --st1:#fbf6f2; --st2:#e6d9d1;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1d1514; --fg:#f1e3dd; --muted:#b89c96; --line:#5a4642; --chip:#2b201f; --st1:#3a2d2b; --st2:#1a1212; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --bg:#1d1514; --fg:#f1e3dd; --muted:#b89c96; --line:#5a4642; --chip:#2b201f; --st1:#3a2d2b; --st2:#1a1212; color-scheme:dark; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Helvetica World",Helvetica,"Helvetica Neue",Arial,sans-serif; padding:20px 16px 36px; }
  main { max-width:900px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:1.2rem; letter-spacing:-.01em; }
  p { margin:0; color:var(--muted); font-size:.82rem; line-height:1.5; }
  #stage { position:relative; margin-top:16px; height:min(68vh,720px); min-height:420px; border-radius:20px; overflow:hidden; background:radial-gradient(circle at 50% 40%,var(--st1),var(--st2)); }
  #stage canvas { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  #stage canvas:active { cursor:grabbing; }
  #info { margin:12px 2px; min-height:1.5em; color:var(--fg); font-weight:700; font-size:.85rem; }
  .panel { display:grid; gap:14px; }
  .row { display:flex; align-items:center; gap:12px; font-weight:700; font-size:.85rem; }
  .row input { flex:1; min-width:0; accent-color:#CD7479; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip, button { font:inherit; font-size:.8rem; color:var(--fg); background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:8px 14px; min-height:38px; display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
  button[aria-pressed="true"] { background:#CD7479; border-color:#CD7479; color:#fff; }
  .chip i { width:14px; height:14px; border-radius:50%; border:1px solid rgba(0,0,0,.25); }
  .chip input { accent-color:#CD7479; margin:0; }
  :is(button,input):focus-visible { outline:3px solid #CD7479; outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Prototipe 3D Tumbler 750 ml</h1>
  <p>Geser untuk memutar dari segala sisi, cubit atau scroll untuk zoom, ketuk bagian untuk melihat namanya.</p>
  <div id="stage" role="img" aria-label="Model 3D tumbler merah muda dengan tutup berulir dan sleeve silikon anti slip deep brown yang bisa dilepas"></div>
  <div id="info"></div>
  <section class="panel">
    <label class="row">Bongkar <input id="ex" type="range" min="0" max="1" step=".01" value="0"></label>
    <div class="chips">
      <button id="open" aria-pressed="false">Buka tutup</button>
      <button id="auto" aria-pressed="false">Putar otomatis</button>
      <button id="reset">Reset tampilan</button>
    </div>
    <div class="chips" id="vis" aria-label="Tampilkan bagian"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=THREE,$=id=>document.getElementById(id),stage=$('stage');
const lin=h=>new T.Color(h).convertSRGBToLinear();
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let renderer;
try{renderer=new T.WebGLRenderer({antialias:true,alpha:true});}catch(e){stage.textContent='Browser ini tidak mendukung WebGL.';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=T.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(35,1,.1,100);

/* lingkungan pantulan sederhana (studio) */
const env=new T.Scene(),gc=document.createElement('canvas');gc.width=4;gc.height=256;
const g2=gc.getContext('2d'),gr=g2.createLinearGradient(0,0,0,256);
gr.addColorStop(0,'#fff');gr.addColorStop(.5,'#d9cfca');gr.addColorStop(1,'#6b5f5b');g2.fillStyle=gr;g2.fillRect(0,0,4,256);
const gt=new T.CanvasTexture(gc);gt.encoding=T.sRGBEncoding;
env.add(new T.Mesh(new T.SphereGeometry(20,32,16),new T.MeshBasicMaterial({map:gt,side:T.BackSide})));
[[-8,5,7,5,9],[9,3,-4,4,8],[0,12,0,8,3]].forEach(a=>{const m=new T.Mesh(new T.BoxGeometry(a[3],a[4],.2),new T.MeshBasicMaterial({color:new T.Color(5,5,5)}));m.position.set(a[0],a[1],a[2]);m.lookAt(0,0,0);env.add(m);});
scene.environment=new T.PMREMGenerator(renderer).fromScene(env,.03).texture;
scene.add(new T.HemisphereLight(0xffffff,0x998888,.2));
const key=new T.DirectionalLight(0xffffff,.5);key.position.set(4,8,6);scene.add(key);
const fill=new T.DirectionalLight(0xffffff,.2);fill.position.set(-5,3,-4);scene.add(fill);

/* tekstur badan: jendela ramping + skala ml (satuan dunia) */
const C=2*Math.PI*.765,WH=3.98;
const cv=(fn,n)=>{const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.setTransform(n/C,0,0,n/WH,0,0);fn(x);return c;};
const stad=(x,cx,y0,y1,r)=>{x.beginPath();x.arc(cx,y0+r,r,Math.PI,0);x.arc(cx,y1-r,r,0,Math.PI);x.closePath();};
const tx=(x,s,a,b)=>{x.save();x.scale(.01,.01);x.font='700 9px "Helvetica World",Helvetica,Arial,sans-serif';x.fillText(s,a*100,b*100);x.restore();};
const cx0=C/2;
const colorTex=new T.CanvasTexture(cv(x=>{
  x.fillStyle='#CD7479';x.fillRect(0,0,C,WH);
  x.fillStyle='#A85A60';stad(x,cx0,.4,3.57,.185);x.fill();
  const w=x.createLinearGradient(cx0-.155,0,cx0+.155,0);
  w.addColorStop(0,'#5d5d5b');w.addColorStop(.4,'#b3b3b0');w.addColorStop(.7,'#8d8d8b');w.addColorStop(1,'#555553');
  x.fillStyle=w;stad(x,cx0,.45,3.52,.155);x.fill();
  x.strokeStyle='rgba(0,0,0,.3)';x.lineWidth=.012;x.stroke();
  x.strokeStyle='#5A2B2A';x.fillStyle='#5A2B2A';x.lineWidth=.016;x.lineCap='round';
  [[.58,'750'],[1.75,'500'],[2.89,'250']].forEach(a=>{x.beginPath();x.moveTo(cx0+.25,a[0]);x.lineTo(cx0+.36,a[0]);x.stroke();tx(x,a[1]+' ml',cx0+.41,a[0]+.044);});
},2048));
const rmTex=new T.CanvasTexture(cv(x=>{
  x.fillStyle='rgb(0,140,0)';x.fillRect(0,0,C,WH);
  x.fillStyle='rgb(0,70,255)';stad(x,cx0,.45,3.52,.155);x.fill();
},1024));
colorTex.encoding=T.sRGBEncoding;
const RY=3.575/WH;
[colorTex,rmTex].forEach(t=>{t.wrapS=T.RepeatWrapping;t.offset.x=.5;t.repeat.y=RY;t.offset.y=1-RY;t.anisotropy=8;});

/* bahan */
const std=(hex,r,o)=>new T.MeshStandardMaterial(Object.assign({color:lin(hex),roughness:r,metalness:0,side:T.DoubleSide,envMapIntensity:.6},o||{}));
const brown=std('#5A2B2A',.4),silicone=std('#5A2B2A',.85),beige=std('#DDD0C8',.55),pink=std('#CD7479',.55);
const wallMat=new T.MeshStandardMaterial({map:colorTex,roughnessMap:rmTex,metalnessMap:rmTex,roughness:1,metalness:1,envMapIntensity:.6});
const L=p=>new T.LatheGeometry(p.map(a=>new T.Vector2(a[0],a[1])),96);

/* geometri */
const capLathe=new T.Mesh(L([[0,.38],[.52,.38],[.52,0],[.62,0],[.625,.012],[.625,.43],[.6,.49],[.55,.5],[0,.5]]),brown);
const sh=new T.Shape();sh.moveTo(-.575,.3);sh.lineTo(-.575,.65);sh.absarc(0,.65,.575,Math.PI,0,true);sh.lineTo(.575,.3);sh.lineTo(-.575,.3);
const hole=new T.Path();hole.moveTo(-.485,.445);hole.lineTo(-.485,.64);hole.absarc(0,.64,.485,Math.PI,0,true);hole.lineTo(.485,.445);hole.lineTo(-.485,.445);
sh.holes.push(hole);
const hg=new T.ExtrudeGeometry(sh,{depth:.4,bevelEnabled:true,bevelThickness:.05,bevelSize:.05,bevelSegments:4,curveSegments:48});
hg.translate(0,0,-.2);
const handle=new T.Mesh(hg,brown);
class Helix extends T.Curve{getPoint(t,o=new T.Vector3()){const a=t*3.2*Math.PI*2;return o.set(.505*Math.cos(a),.05+t*.3,.505*Math.sin(a));}}
const thread=new T.Mesh(new T.TubeGeometry(new Helix(),200,.03,8,false),brown);
const ring=new T.Mesh(L([[.5,0],[.66,0],[.672,.014],[.612,.298],[.6,.315],[.5,.315],[.5,0]]),beige);
const wall=new T.Mesh(new T.CylinderGeometry(.765,.765,3.575,96,1,true),wallMat);wall.position.y=2.4125;
const shell=new T.Mesh(L([[0,.1],[.70,.1],[.70,.56],[.765,.625],[.765,.66]]),pink);
const rim=new T.Mesh(L([[.5,4.46],[.62,4.46],[.67,4.44],[.72,4.38],[.76,4.3],[.765,4.2]]),pink);
const steel=std('#c8cacc',.28,{metalness:1,envMapIntensity:1.2});
const inner=new T.Mesh(L([[0,.12],[.64,.12],[.64,3.95],[.5,4.1],[.5,4.46]]),steel);
const base=new T.Mesh(L([[0,0],[.66,0],[.72,.025],[.755,.07],[.765,.12],[.765,.6],[.75,.625],[.715,.625],[.70,.61],[.70,.1],[0,.1]]),silicone);

const parts={};
const mk=(k,name,hex,y,ms)=>{const g=new T.Group();g.userData.k=k;ms.forEach(m=>g.add(m));g.position.y=y;scene.add(g);const mats=[];g.traverse(o=>{if(o.material)mats.push(o.material);});parts[k]={g,name,hex,y,mats};};
mk('cap','Tutup dan pegangan: deep brown','#5A2B2A',4.78,[capLathe,handle,thread]);
ring.position.y=4.462;
mk('body','Badan tumbler + interlayer: merah muda #CD7479 dengan interlayer cool beige, kaca ramping, skala ml, dan bagian dalam stainless steel','#CD7479',0,[wall,shell,rim,inner,ring]);
mk('base','Dasar anti slip: sleeve karet silikon deep brown yang bisa dilepas pasang','#5A2B2A',0,[base]);
const NAMES={cap:'Tutup',body:'Badan + interlayer',base:'Dasar anti slip'};

/* bayangan lantai */
const sc=document.createElement('canvas');sc.width=sc.height=128;
const s2=sc.getContext('2d'),sg=s2.createRadialGradient(64,64,4,64,64,64);
sg.addColorStop(0,'rgba(60,30,28,.5)');sg.addColorStop(1,'rgba(60,30,28,0)');s2.fillStyle=sg;s2.fillRect(0,0,128,128);
const st=new T.CanvasTexture(sc);st.encoding=T.sRGBEncoding;
const shadow=new T.Mesh(new T.PlaneGeometry(3.6,3.6),new T.MeshBasicMaterial({map:st,transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;scene.add(shadow);

/* kontrol */
let yaw=.55,pitch=.12,dist=13,ex=0,op=0,opT=0,auto=false,sel=null;
const AMT={cap:2.1,body:0,base:-1};
const info=$('info'),DEF='Ketuk bagian mana pun untuk melihat namanya.';
info.textContent=DEF;
function select(k){
  sel=k;
  for(const n in parts){const p=parts[n];p.mats.forEach(m=>{m.emissive.copy(n===k?lin(m===beige?'#DDD0C8':m===steel?'#c8cacc':p.hex):new T.Color(0));m.emissiveIntensity=.3;});}
  info.textContent=k?parts[k].name:DEF;
}
const rc=new T.Raycaster(),mv=new T.Vector2();
function pick(e){
  const r=renderer.domElement.getBoundingClientRect();
  mv.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  rc.setFromCamera(mv,camera);
  const objs=Object.values(parts).filter(p=>p.g.visible).map(p=>p.g);
  const h=rc.intersectObjects(objs,true)[0];
  if(!h){select(null);return;}
  let o=h.object;while(o&&!o.userData.k)o=o.parent;
  select(o?o.userData.k:null);
}
const el=renderer.domElement,ps=new Map();let moved=0;
const d2=()=>{const a=[...ps.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);};
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ps.set(e.pointerId,[e.clientX,e.clientY]);moved=0;});
el.addEventListener('pointermove',e=>{
  const p=ps.get(e.pointerId);if(!p)return;
  const before=ps.size===2?d2():0,dx=e.clientX-p[0],dy=e.clientY-p[1];
  p[0]=e.clientX;p[1]=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ps.size===1){yaw-=dx*.009;pitch=clamp(pitch+dy*.006,-1.2,1.35);}
  else if(ps.size===2){const a=d2();if(before>0&&a>0)dist=clamp(dist*before/a,5,24);}
});
const up=e=>{if(e.type==='pointerup'&&ps.size===1&&moved<6)pick(e);ps.delete(e.pointerId);};
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist*Math.exp(e.deltaY*.001),5,24);},{passive:false});

/* antarmuka */
const vis=$('vis');
Object.keys(parts).forEach(k=>{
  const l=document.createElement('label');l.className='chip';
  l.innerHTML='<input type="checkbox" checked><i style="background:'+parts[k].hex+'"></i>'+NAMES[k];
  l.firstChild.addEventListener('change',e=>{parts[k].g.visible=e.target.checked;if(!e.target.checked&&sel===k)select(null);});
  vis.appendChild(l);
});
$('ex').addEventListener('input',e=>{ex=+e.target.value;});
const openB=$('open'),autoB=$('auto');
openB.addEventListener('click',()=>{opT=opT?0:1;openB.setAttribute('aria-pressed',opT?'true':'false');openB.textContent=opT?'Tutup lagi':'Buka tutup';});
autoB.addEventListener('click',()=>{auto=!auto;autoB.setAttribute('aria-pressed',auto?'true':'false');});
$('reset').addEventListener('click',()=>{
  yaw=.55;pitch=.12;dist=13;ex=0;opT=0;$('ex').value=0;
  openB.setAttribute('aria-pressed','false');openB.textContent='Buka tutup';
  vis.querySelectorAll('input').forEach(i=>{i.checked=true;});
  Object.values(parts).forEach(p=>{p.g.visible=true;});select(null);
});

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();

let last=performance.now();
function tick(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  op+=(opT-op)*Math.min(1,dt*4);
  if(auto&&!ps.size)yaw+=dt*.6;
  for(const k in parts){const p=parts[k];p.g.position.y=p.y+AMT[k]*ex+(k==='cap'?2.2*op:0);}
  parts.cap.g.rotation.y=op*Math.PI*2;
  shadow.position.y=parts.base.g.position.y-.01;
  const ty=3.05+.7*ex+.9*op*.5;
  camera.position.set(dist*Math.sin(yaw)*Math.cos(pitch),ty+dist*Math.sin(pitch),dist*Math.cos(yaw)*Math.cos(pitch));
  camera.lookAt(0,ty,0);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
