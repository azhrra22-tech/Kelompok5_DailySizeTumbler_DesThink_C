<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Size Tumbler 750 ml</title>
<style>
:root{--bg:#EADFCF;--card:#F6EFE3;--line:#D4C4AB;--fg:#3B2A1E;--mut:#86705A;--acc:#8A6A3F;--btn:#4A3426;--btf:#F6EFE3;--st1:#F7F0E4;--st2:#D9C8AE;--trk:#E3D5BF;--sel:#FCF8F0;--lb:#E9D3A6;--dot:#8A5A3C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme=dark]{--bg:#1C1610;--card:#292017;--line:#43362A;--fg:#EADFCF;--mut:#A69580;--acc:#C9A869;--btn:#EADFCF;--btf:#2A2017;--st1:#3A2E22;--st2:#17120D;--trk:#1C1610;--sel:#43362A;--lb:#CDB27E;--dot:#6B4326;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:is(button,input):focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:1080px;margin:0 auto;padding:12px 14px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.brand .ic{width:38px;height:38px;padding:7px;border-radius:12px;background:var(--btn);color:var(--btf);stroke-width:1.5}
h1{margin:0;font:700 22px/1 Georgia,"Times New Roman",serif;letter-spacing:-.01em}
h1 small{display:block;margin-top:4px;font:400 12px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--mut);letter-spacing:.02em}
.sw{width:40px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
[aria-checked=true]>.sw{background:var(--acc)}[aria-checked=true]>.sw:after{transform:translateX(18px)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;min-height:40px}
main{display:flex;flex-direction:column;gap:12px}
#stage{position:relative;height:max(58vh,440px);max-height:680px;border-radius:30px 30px 30px 8px;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,var(--st1),var(--st2));border:1px solid var(--line)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#lbls,#ln{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
#ln line{stroke:var(--fg);stroke-opacity:.55;stroke-width:1}#ln circle{fill:var(--fg);r:3}
.lb{position:absolute;left:0;top:0;z-index:2;pointer-events:auto;display:flex;align-items:center;gap:6px;max-width:118px;background:var(--lb);color:#3B2A1E;border:1px solid rgba(59,42,30,.18);border-radius:8px 14px 14px 8px;padding:6px 10px;font-weight:600;font-size:11.5px;line-height:1.15;text-align:left;transition:opacity .2s}
.lb i{width:7px;height:7px;border-radius:50%;background:var(--dot);flex:none}
.lb.off{opacity:0;pointer-events:none}.lb.on{outline:2px solid var(--fg)}
.modes{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.modes button{border:0;background:none;border-radius:99px;padding:7px 14px;font-size:12.5px;white-space:nowrap}
.modes button[aria-pressed=true]{background:var(--btn);color:var(--btf);font-weight:600}
.tb{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:3;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}
.tb button{width:44px;height:40px;border:0;background:none;border-radius:12px;display:grid;place-items:center}
.tb button[aria-checked=true]{background:var(--trk)}
#cp{position:absolute;z-index:1;left:12px;right:12px;bottom:66px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:12px;display:none;pointer-events:none}
#cp b{display:block;font-size:13px;margin-bottom:2px}#cp span{color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px 30px 30px 30px;padding:12px}
.tabs{display:flex;gap:4px;background:var(--trk);padding:4px;border-radius:14px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;border-radius:11px;padding:9px 4px;font-size:13px}
.tabs button[aria-selected=true]{background:var(--sel);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pane{display:none}.pane.on{display:block}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.crow:last-child{border:0}.crow b{display:block;font-size:13px}.crow small{color:var(--mut);font-size:12px}
.sws{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.sws button{width:30px;height:30px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.sws button[aria-pressed=true]{outline:2px solid var(--fg);outline-offset:3px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tag{font-size:12px;color:var(--mut);background:var(--trk);border-radius:99px;padding:4px 11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button{display:flex;align-items:center;gap:8px;background:var(--sel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.two button:disabled{opacity:.4;cursor:default}
.sl .l{display:flex;justify-content:space-between;color:var(--mut);margin-bottom:6px}.sl .l b{color:var(--fg)}
.sl input{width:100%;accent-color:var(--acc);margin:0}
#sheet{display:flex;flex-wrap:wrap;gap:8px}
#sheet label{display:inline-flex;gap:7px;align-items:center;background:var(--sel);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:12.5px}
#sheet input{accent-color:var(--acc);margin:0}
.app.full{position:fixed;inset:0;z-index:5;max-width:none;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
.full header,.full .panel{display:none}.full main{flex:1;min-height:0}.full #stage{flex:1;height:auto;max-height:none}
@media(min-width:860px){main{display:grid;grid-template-columns:1.5fr 1fr;align-items:start;gap:16px}#stage{height:max(72vh,540px)}.panel{position:sticky;top:12px}.full main{display:flex}}
@media(prefers-reduced-motion:reduce){.sw,.sw:after,.lb{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="cup" viewBox="0 0 24 24"><path d="M9 2h6v3H9zM7 5h10l-1 17H8z"/><path d="M9 11h6"/></symbol>
<symbol id="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
<symbol id="help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/></symbol>
<symbol id="exp" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="lid" viewBox="0 0 24 24"><path d="M12 4l7 6v4H5v-4zM5 19h14"/></symbol>
<symbol id="tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/></symbol>
<symbol id="undo" viewBox="0 0 24 24"><path d="M4 4v6h6M4.5 14a8 8 0 1 0 2-8L4 10"/></symbol>
<symbol id="redo" viewBox="0 0 24 24"><path d="M20 4v6h-6M19.5 14a8 8 0 1 1-2-8L20 10"/></symbol>
</svg>
<div class="app" id="app">
  <header>
    <div class="brand"><svg class="ic"><use href="#cup"/></svg><h1>Daily Size Tumbler<small>Kapasitas 750 ml</small></h1></div>
    <button class="pill" id="theme" role="switch" aria-checked="false" aria-label="Mode gelap"><svg class="ic"><use href="#moon"/></svg><span class="sw"></span></button>
  </header>
  <main>
    <section id="stage" role="img" aria-label="Model 3D Daily Size Tumbler 750 ml dengan label tiap bagian">
      <svg id="ln"></svg><div id="lbls"></div>
      <div id="cp"><b></b><span></span></div>
      <div class="modes" id="seg"></div>
      <div class="tb">
        <button id="ul" aria-label="Putar kiri"><svg class="ic"><use href="#undo"/></svg></button>
        <button id="ur" aria-label="Putar kanan"><svg class="ic"><use href="#redo"/></svg></button>
        <button id="lt" aria-checked="true" aria-label="Tampilkan label"><svg class="ic"><use href="#tag"/></svg></button>
        <button id="help" aria-label="Bantuan"><svg class="ic"><use href="#help"/></svg></button>
        <button id="full" aria-label="Layar penuh"><svg class="ic"><use href="#exp"/></svg></button>
      </div>
    </section>
    <section class="panel">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="pane on">
        <div class="crow"><div><b>Badan luar</b><small id="nB"></small></div><div class="sws" id="swB"></div></div>
        <div class="crow"><div><b>Tutup</b><small id="nC"></small></div><div class="sws" id="swC"></div></div>
        <div class="crow"><div><b>Karet silikon</b><small id="nS"></small></div><div class="sws" id="swS"></div></div>
      </div>
      <div class="pane">
        <div class="ch"><b>Tutup ulir</b><span class="tag" id="st">Terkunci</span></div>
        <div class="two">
          <button id="b1"><svg class="ic"><use href="#lock"/></svg><span></span></button>
          <button id="b2"><svg class="ic"><use href="#lid"/></svg><span></span></button>
        </div>
      </div>
      <div class="pane sl">
        <div class="l"><span>Bongkar</span><b id="pc">0%</b></div>
        <input id="ex" type="range" min="0" max="100" value="0" aria-label="Bongkar">
      </div>
      <div class="pane"><div id="sheet" aria-label="Tampilkan bagian"></div></div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=THREE,$=id=>document.getElementById(id),stage=$('stage'),V3=T.Vector3;
const lin=h=>new T.Color(h).convertSRGBToLinear(),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let renderer;
try{renderer=new T.WebGLRenderer({antialias:true,alpha:true});}catch(e){stage.textContent='Browser ini tidak mendukung WebGL.';return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=T.sRGBEncoding;renderer.localClippingEnabled=true;
stage.insertBefore(renderer.domElement,stage.firstChild);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(35,1,.1,100);

/* lingkungan pantulan studio */
const env=new T.Scene(),gc=document.createElement('canvas');gc.width=4;gc.height=256;
const g2=gc.getContext('2d'),gr=g2.createLinearGradient(0,0,0,256);
gr.addColorStop(0,'#fff');gr.addColorStop(.5,'#d9cfca');gr.addColorStop(1,'#6b5f5b');g2.fillStyle=gr;g2.fillRect(0,0,4,256);
const gt=new T.CanvasTexture(gc);gt.encoding=T.sRGBEncoding;
env.add(new T.Mesh(new T.SphereGeometry(20,32,16),new T.MeshBasicMaterial({map:gt,side:T.BackSide})));
[[-8,5,7,5,9],[9,3,-4,4,8],[0,12,0,8,3]].forEach(a=>{const m=new T.Mesh(new T.BoxGeometry(a[3],a[4],.2),new T.MeshBasicMaterial({color:new T.Color(5,5,5)}));m.position.set(a[0],a[1],a[2]);m.lookAt(0,0,0);env.add(m);});
scene.environment=new T.PMREMGenerator(renderer).fromScene(env,.03).texture;
scene.add(new T.HemisphereLight(0xffffff,0x998888,.2));
const key=new T.DirectionalLight(0xffffff,.5);key.position.set(4,8,6);scene.add(key);
const fill=new T.DirectionalLight(0xffffff,.2);fill.position.set(-5,3,-4);scene.add(fill);

/* warna */
const PAL=[{n:'Pink',hex:'#CD7479',dk:'#A85A60',ink:'#5A2B2A'},{n:'Light blue',hex:'#9CCBEA',dk:'#6FA3C6',ink:'#1F4562'},{n:'Kuning',hex:'#F2CB4B',dk:'#C9A12D',ink:'#5A4510'},{n:'Abu-abu',hex:'#A5A9AD',dk:'#7D8286',ink:'#2F3438'},{n:'Hitam',hex:'#26282B',dk:'#17181A',ink:'#D8DADC'},{n:'Sage green',hex:'#8FAA85',dk:'#6C8A63',ink:'#2B4328'},{n:'Terracotta',hex:'#C1694F',dk:'#9C4F3A',ink:'#4A1F14'},{n:'Navy',hex:'#2F4A6D',dk:'#22364F',ink:'#DCE6F2'},{n:'Lavender',hex:'#B7A6D6',dk:'#8E7DB5',ink:'#3A2D5C'},{n:'Krem',hex:'#EFE8DA',dk:'#CFC5B2',ink:'#5A4A33'},{n:'Olive',hex:'#7A7A45',dk:'#5C5C30',ink:'#F0EBCC'},{n:'Oranye',hex:'#E58A3C',dk:'#B96A24',ink:'#4A260A'}];
const CP=[{n:'Deep brown (asli)',hex:'#5A2B2A'},...PAL];
const SIL=[{n:'Asli (brown + krem)',hex:'#5A2B2A',g:'#EDEAE2'},...PAL.map(p=>({n:p.n,hex:p.hex}))];
let bi=0,ci=0,si=0;

/* tekstur badan: jendela ramping + skala ml */
const C=2*Math.PI*.765,WH=3.98,cx0=C/2;
const mkc=n=>{const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.setTransform(n/C,0,0,n/WH,0,0);return[c,x];};
const stad=(x,cx,y0,y1,r)=>{x.beginPath();x.arc(cx,y0+r,r,Math.PI,0);x.arc(cx,y1-r,r,0,Math.PI);x.closePath();};
const [bc,bx]=mkc(2048),[mc,mx]=mkc(1024);
const colorTex=new T.CanvasTexture(bc),rmTex=new T.CanvasTexture(mc);
mx.fillStyle='rgb(0,140,0)';mx.fillRect(0,0,C,WH);mx.fillStyle='rgb(0,70,255)';stad(mx,cx0,.45,3.52,.155);mx.fill();
function paint(p){const x=bx;x.fillStyle=p.hex;x.fillRect(0,0,C,WH);x.fillStyle=p.dk;stad(x,cx0,.4,3.57,.185);x.fill();
  const w=x.createLinearGradient(cx0-.155,0,cx0+.155,0);
  w.addColorStop(0,'#5d5d5b');w.addColorStop(.4,'#b3b3b0');w.addColorStop(.7,'#8d8d8b');w.addColorStop(1,'#555553');
  x.fillStyle=w;stad(x,cx0,.45,3.52,.155);x.fill();x.strokeStyle='rgba(0,0,0,.3)';x.lineWidth=.012;x.stroke();
  x.strokeStyle=x.fillStyle=p.ink;x.lineWidth=.016;x.lineCap='round';
  [[.58,'750'],[1.75,'500'],[2.89,'250']].forEach(a=>{x.beginPath();x.moveTo(cx0+.25,a[0]);x.lineTo(cx0+.36,a[0]);x.stroke();
    x.save();x.scale(.01,.01);x.font='italic 700 8px Helvetica,Arial,sans-serif';x.fillText(a[1]+' ml',(cx0+.41)*100,(a[0]+.044)*100);x.restore();});
  colorTex.needsUpdate=true;}
colorTex.encoding=T.sRGBEncoding;
const RY=3.575/WH;
[colorTex,rmTex].forEach(t=>{t.wrapS=T.RepeatWrapping;t.offset.x=.5;t.repeat.y=RY;t.offset.y=1-RY;t.anisotropy=8;});

/* bahan */
const plane=new T.Plane(new V3(0,0,1),1e3);
const std=(hex,r,o)=>new T.MeshStandardMaterial(Object.assign({color:lin(hex),roughness:r,metalness:0,side:T.DoubleSide,envMapIntensity:.6,clippingPlanes:[plane]},o||{}));
const capM=std('#5A2B2A',.4),hanM=std('#5A2B2A',.4),thrM=std('#5A2B2A',.4),mthM=std('#CDBFB4',.5),gasM=std('#EDEAE2',.8),ringM=std('#DDD0C8',.55),
  rimM=std('#CD7479',.55),shellM=std('#CD7479',.55),baseM=std('#5A2B2A',.85),steelM=std('#c8cacc',.28,{metalness:1,envMapIntensity:1.2}),
  wallM=new T.MeshStandardMaterial({map:colorTex,roughnessMap:rmTex,metalnessMap:rmTex,roughness:1,metalness:1,envMapIntensity:.6,clippingPlanes:[plane]});
const L=p=>new T.LatheGeometry(p.map(a=>new T.Vector2(a[0],a[1])),96);
const M=(g,m)=>new T.Mesh(g,m);

/* geometri */
const capLathe=M(L([[0,.38],[.38,.38],[.38,-.3],[.42,-.3],[.42,.38],[.52,.38],[.52,0],[.62,0],[.625,.012],[.625,.43],[.6,.49],[.55,.5],[0,.5]]),capM);
const sh=new T.Shape();sh.moveTo(-.575,.3);sh.lineTo(-.575,.65);sh.absarc(0,.65,.575,Math.PI,0,true);sh.lineTo(.575,.3);sh.lineTo(-.575,.3);
const hole=new T.Path();hole.moveTo(-.485,.445);hole.lineTo(-.485,.64);hole.absarc(0,.64,.485,Math.PI,0,true);hole.lineTo(.485,.445);hole.lineTo(-.485,.445);
sh.holes.push(hole);
const hg=new T.ExtrudeGeometry(sh,{depth:.4,bevelEnabled:true,bevelThickness:.05,bevelSize:.05,bevelSegments:4,curveSegments:48});hg.translate(0,0,-.2);
class Helix extends T.Curve{constructor(r,y,h,n,ph){super();Object.assign(this,{r,y,h,n,ph});}getPoint(t,o=new V3()){const a=this.ph+t*this.n*Math.PI*2;return o.set(this.r*Math.cos(a),this.y+t*this.h,this.r*Math.sin(a));}}
const thread=M(new T.TubeGeometry(new Helix(.44,-.25,.3,2.5,0),200,.03,8,false),thrM);
const mthread=M(new T.TubeGeometry(new Helix(.485,.06,.24,2,Math.PI),160,.028,8,false),mthM);
const gasket=M(new T.TorusGeometry(.475,.04,12,64).rotateX(Math.PI/2).translate(0,.06,0),gasM);
const ring=M(L([[.5,0],[.66,0],[.672,.014],[.612,.298],[.6,.315],[.5,.315],[.5,0]]),ringM);
const wall=M(new T.CylinderGeometry(.765,.765,3.575,96,1,true),wallM);wall.position.y=2.4125;
const shell=M(L([[0,.1],[.70,.1],[.70,.56],[.765,.625],[.765,.66]]),shellM);
const rim=M(L([[.5,4.46],[.62,4.46],[.67,4.44],[.72,4.38],[.76,4.3],[.765,4.2]]),rimM);
const inner=M(L([[0,.12],[.64,.12],[.64,3.95],[.5,4.1],[.5,4.46]]),steelM);
const base=M(L([[0,0],[.66,0],[.72,.025],[.755,.07],[.765,.12],[.765,.6],[.75,.625],[.715,.625],[.70,.61],[.70,.1],[0,.1]]),baseM);

const parts={},meshes=[];
const mk=(k,n,y,amt,ms)=>{const g=new T.Group();ms.forEach(m=>{g.add(m);meshes.push(m);});g.position.y=y;scene.add(g);parts[k]={g,n,y,amt,mats:ms.map(m=>m.material)};};
mk('cap','Tutup botol',4.78,2.1,[capLathe]);
mk('handle','Handle',4.78,2.1,[M(hg,hanM)]);
mk('thread','Ulir tutup',4.78,2.1,[thread]);
mk('gasket','Karet silikon',4.78,2.1,[gasket]);
mk('ring','Mulut botol',4.462,0,[ring]);
mk('mthread','Ulir mulut botol',4.462,0,[mthread]);
mk('body','Badan luar',0,0,[wall,shell,rim]);
mk('steel','Stainless steel dalam',0,0,[inner]);
mk('base','Anti slip',0,-1,[base]);
parts.body.d='Dinding luar berwarna dengan jendela ramping dan skala ml.';
const CAPK=['cap','handle','thread','gasket'];

/* bayangan lantai */
const sc=document.createElement('canvas');sc.width=sc.height=128;
const s2=sc.getContext('2d'),sg=s2.createRadialGradient(64,64,4,64,64,64);
sg.addColorStop(0,'rgba(60,40,25,.45)');sg.addColorStop(1,'rgba(60,40,25,0)');s2.fillStyle=sg;s2.fillRect(0,0,128,128);
const st=new T.CanvasTexture(sc);st.encoding=T.sRGBEncoding;
const shadow=M(new T.PlaneGeometry(3.6,3.6),new T.MeshBasicMaterial({map:st,transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;scene.add(shadow);

/* label tiap bagian */
const LB=[
{p:'handle',t:'Handle',s:1,a:[0,1.3,0],d:'Pegangan atas untuk menenteng tumbler. Ikut terangkat bersama tutup.'},
{p:'cap',t:'Tutup botol',s:-1,r:[.63,.22],f:0,d:'Tutup berulir yang dikunci dengan diputar. Putar penuh sampai rapat.'},
{p:'thread',t:'Ulir tutup',s:1,r:[.45,-.1],f:2,d:'Ulir pada batang tutup yang masuk ke mulut botol dan berpasangan dengan ulir mulut botol.'},
{p:'gasket',t:'Karet silikon anti bocor',s:-1,r:[.5,.06],f:1,d:'Cincin silikon ramping yang terselip di atas ulir, di dalam tutup, agar tidak bocor. Warnanya bisa diganti di tab Warna.'},
{p:'ring',t:'Mulut botol',s:1,r:[.64,.15],f:0,d:'Bibir leher botol dengan interlayer beige, tempat tutup dan karet menempel.'},
{p:'mthread',t:'Ulir mulut botol',s:-1,r:[.48,.17],f:1,d:'Ulir di bagian atas dalam mulut botol, tempat ulir tutup masuk dan mengunci.'},
{p:'body',t:'Penanda kapasitas',s:1,a:[.292,2.45,.707],d:'Skala 250, 500, dan 750 ml pada jendela ramping untuk memantau isi.'},
{p:'base',t:'Anti slip',s:-1,r:[.765,.3],f:0,d:'Sleeve karet silikon di dasar, bisa dilepas pasang, agar tumbler tidak mudah tergelincir. Warnanya bisa diganti.'},
{p:'steel',t:'Bagian dalam stainless steel',s:-1,r:[.64,1.8],f:1,d:'Dinding dalam stainless steel yang higienis dan tidak menyerap bau. Lihat lewat mode Potongan.'}];
const lbs=$('lbls'),sv=$('ln'),NS='http://www.w3.org/2000/svg';
LB.forEach(l=>{
  l.el=document.createElement('button');l.el.className='lb';l.el.innerHTML='<i></i>'+l.t;
  l.el.onclick=()=>select(l.p,l);lbs.appendChild(l.el);
  l.ln=document.createElementNS(NS,'line');l.dt=document.createElementNS(NS,'circle');sv.append(l.ln,l.dt);
});

/* keadaan */
let yaw=.55,pitch=.12,dist=13,mode=0,ex=0,exT=0,lift=0,liftT=0,cs=0,sel=null,showL=true,tw=null,fr=0,ty=3.05;
const cp=$('cp');
function showCap(t,d){cp.style.display=t?'block':'none';if(t){cp.firstChild.textContent=t;cp.lastChild.textContent=d||'';}}
function select(k,l){
  const q=k&&(l||(k!=='body'&&LB.find(x=>x.p===k)));
  const id=k&&(q?q.t:k);
  if(k&&cp.dataset.k===id)k=null;
  sel=k;cp.dataset.k=k?id:'';
  LB.forEach(x=>x.el.classList.toggle('on',!!k&&x===q));
  if(!k){showCap(null);return;}
  showCap(q?q.t:parts[k].n,q?q.d:parts[k].d);
}
const rc=new T.Raycaster(),rc2=new T.Raycaster(),mv=new T.Vector2();
const vis=o=>{for(;o;o=o.parent)if(!o.visible)return false;return true;};
function pick(e){
  const r=renderer.domElement.getBoundingClientRect();
  mv.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  rc.setFromCamera(mv,camera);
  const h=rc.intersectObjects(meshes.filter(vis),false).find(h=>!(mode===2&&plane.distanceToPoint(h.point)<0));
  if(!h){select(null);return;}
  let o=h.object;while(o&&!Object.values(parts).some(p=>p.g===o))o=o.parent;
  select(Object.keys(parts).find(k=>parts[k].g===o));
}
const el=renderer.domElement,ps=new Map();let moved=0;
const d2=()=>{const a=[...ps.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);};
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ps.set(e.pointerId,[e.clientX,e.clientY]);moved=0;tw=null;});
el.addEventListener('pointermove',e=>{
  const p=ps.get(e.pointerId);if(!p)return;
  const before=ps.size===2?d2():0,dx=e.clientX-p[0],dy=e.clientY-p[1];
  p[0]=e.clientX;p[1]=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ps.size===1){yaw-=dx*.009;pitch=clamp(pitch+dy*.006,-1.2,1.35);}
  else if(ps.size===2){const a=d2();if(before>0&&a>0)dist=clamp(dist*before/a,5,24);}
});
const up=e=>{if(e.type==='pointerup'&&ps.size===1&&moved<6)pick(e);ps.delete(e.pointerId);};
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist*Math.exp(e.deltaY*.001),5,24);},{passive:false});

/* antarmuka */
const mkSw=(box,list,fn)=>list.forEach((p,i)=>{const b=document.createElement('button');b.style.background=p.hex;b.title=b.ariaLabel=p.n;b.onclick=()=>fn(i);box.appendChild(b);});
const mark=(box,i)=>[...box.children].forEach((b,j)=>b.setAttribute('aria-pressed',i===j));
function setBody(i){bi=i;const p=PAL[i];paint(p);[rimM,shellM].forEach(m=>m.color.copy(lin(p.hex)));mark($('swB'),i);$('nB').textContent=p.n;}
function setCap(i){ci=i;[capM,hanM,thrM].forEach(m=>m.color.copy(lin(CP[i].hex)));mark($('swC'),i);$('nC').textContent=CP[i].n;}
function setSil(i){si=i;const p=SIL[i];baseM.color.copy(lin(p.hex));gasM.color.copy(lin(p.g||p.hex));mark($('swS'),i);$('nS').textContent=p.n;}
mkSw($('swB'),PAL,setBody);mkSw($('swC'),CP,setCap);mkSw($('swS'),SIL,setSil);setBody(0);setCap(0);setSil(0);
$('tabs').innerHTML=['Warna','Tutup','Tampilan','Bagian'].map((t,i)=>'<button role="tab" aria-selected="'+(i===0)+'">'+t+'</button>').join('');
const panes=document.querySelectorAll('.pane');
[...$('tabs').children].forEach((b,i)=>b.onclick=()=>{[...$('tabs').children].forEach((c,j)=>c.setAttribute('aria-selected',i===j));panes.forEach((p,j)=>p.classList.toggle('on',i===j));});

const sheet=$('sheet');
Object.keys(parts).forEach(k=>{const l=document.createElement('label');l.innerHTML='<input type="checkbox" checked>'+parts[k].n;
  l.firstChild.onchange=e=>{parts[k].g.visible=e.target.checked;if(!e.target.checked&&sel===k)select(null);};sheet.appendChild(l);});
$('lt').onclick=e=>{showL=!showL;e.currentTarget.setAttribute('aria-checked',showL);lbs.style.display=sv.style.display=showL?'':'none';};
$('theme').onclick=e=>{const d=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=d?'dark':'light';e.currentTarget.setAttribute('aria-checked',d);};
if(matchMedia('(prefers-color-scheme: dark)').matches)$('theme').click();
$('help').onclick=()=>showCap('Cara pakai','Geser untuk memutar, cubit atau scroll untuk zoom. Ketuk label atau bagian untuk detailnya.');
$('full').onclick=()=>{$('app').classList.toggle('full');};
$('ul').onclick=()=>{tw={yaw:yaw+Math.PI/4};};$('ur').onclick=()=>{tw={yaw:yaw-Math.PI/4};};

const T1=['Putar buka ulir','Putar kunci ulir','Putar buka ulir'],T2=['Angkat tutup','Angkat tutup','Pasang tutup'],ST=['Terkunci','Ulir longgar','Terbuka'];
function capUI(){$('b1').lastChild.textContent=T1[cs];$('b2').lastChild.textContent=T2[cs];$('b1').disabled=cs===2;$('b2').disabled=cs===0;$('st').textContent=ST[cs];liftT=[0,.3,2.2][cs];}
$('b1').onclick=()=>{cs=cs?0:1;capUI();};$('b2').onclick=()=>{cs=cs===1?2:1;capUI();};capUI();

const MODES=['Utuh','Bedah','Potongan'],seg=$('seg');
const setPct=()=>{$('pc').textContent=Math.round(exT*100)+'%';$('ex').value=exT*100;};
function setMode(m){
  mode=m;[...seg.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===m));
  exT=[0,1,0][m];setPct();tw={pitch:m===1?-.12:.12};
  plane.constant=m===2?0:1e3;select(null);
}
MODES.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>setMode(i);seg.appendChild(b);});
$('ex').oninput=e=>{exT=e.target.value/100;$('pc').textContent=e.target.value+'%';};
setMode(0);

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();LB.forEach(l=>l.w=0);}
new ResizeObserver(resize).observe(stage);resize();

/* posisi label di layar */
function anc(l){
  const g=parts[l.p].g;if(l.a)return g.localToWorld(new V3(...l.a));
  const f=l.f===1||(l.f===2&&mode===2),th=Math.atan2(camera.position.x,camera.position.z)+(f?Math.PI-l.s*.8:l.s*.8);
  return new V3(l.r[0]*Math.sin(th),g.position.y+l.r[1],l.r[0]*Math.cos(th));
}
function occl(p){
  const d=p.clone().sub(camera.position),len=d.length();rc2.set(camera.position,d.normalize());
  const h=rc2.intersectObjects(meshes.filter(vis),false).find(h=>!(mode===2&&plane.distanceToPoint(h.point)<0));
  return !!h&&h.distance<len-.2;
}
function labels(){
  const W=stage.clientWidth,H=stage.clientHeight,S=[[],[]],c=new V3(0,ty,0);
  const c0=c.clone().project(camera),rt=new V3().setFromMatrixColumn(camera.matrixWorld,0).multiplyScalar(.8).add(c).project(camera);
  const cx=(c0.x*.5+.5)*W,hw=Math.abs(rt.x-c0.x)*W/2;
  LB.forEach(l=>{
    const w3=anc(l),sp=w3.clone().project(camera);
    if(fr%6===0)l.oc=occl(w3);
    const on=showL&&parts[l.p].g.visible&&!l.oc&&sp.z<1;
    l.el.classList.toggle('off',!on);
    l.ln.style.display=l.dt.style.display=on?'':'none';
    if(!on)return;
    if(!l.w){l.w=l.el.offsetWidth;l.h=l.el.offsetHeight;}
    l.x=(sp.x*.5+.5)*W;l.y=l.py=(-sp.y*.5+.5)*H;S[l.s>0?0:1].push(l);
  });
  S.forEach((a,k)=>{
    a.sort((p,q)=>p.y-q.y);
    a.forEach((l,i)=>{l.py=Math.max(l.py,i?a[i-1].py+(a[i-1].h+l.h)/2+4:l.h/2+6);});
    for(let i=a.length-1;i>=0;i--){const l=a[i];l.py=Math.min(l.py,i<a.length-1?a[i+1].py-(a[i+1].h+l.h)/2-4:H-l.h/2-6);}
    a.forEach(l=>{
      const px=k===0?clamp(cx+hw+16,6,W-l.w-6):clamp(cx-hw-16-l.w,6,W-l.w-6);
      l.el.style.transform='translate('+px+'px,'+(l.py-l.h/2)+'px)';
      l.ln.setAttribute('x1',l.x);l.ln.setAttribute('y1',l.y);l.ln.setAttribute('x2',k===0?px:px+l.w);l.ln.setAttribute('y2',l.py);
      l.dt.setAttribute('cx',l.x);l.dt.setAttribute('cy',l.y);
    });
  });
}

const ZERO=new T.Color(0);
let last=performance.now();
function tick(t){
  const dt=Math.min((t-last)/1000,.05);last=t;fr++;
  ex+=(exT-ex)*Math.min(1,dt*4);lift+=(liftT-lift)*Math.min(1,dt*4);
  if(tw){const k=Math.min(1,dt*6);let d=0;
    if(tw.yaw!=null){yaw+=(tw.yaw-yaw)*k;d+=Math.abs(tw.yaw-yaw);}
    if(tw.pitch!=null){pitch+=(tw.pitch-pitch)*k;d+=Math.abs(tw.pitch-pitch);}
    if(d<.003)tw=null;}
  const spin=clamp(lift/.3,0,1)*Math.PI*5;
  for(const k in parts){const p=parts[k];p.g.position.y=p.y+p.amt*ex+(CAPK.includes(k)?lift:0);
    if(CAPK.includes(k))p.g.rotation.y=spin;}
  for(const k in parts)parts[k].mats.forEach(m=>{
    m.emissive.copy(k===sel?(m===wallM?lin(PAL[bi].hex):m.color):ZERO);m.emissiveIntensity=.3;});
  shadow.position.y=parts.base.g.position.y-.01;
  if(mode===2)plane.normal.set(-Math.sin(yaw),0,-Math.cos(yaw));
  const H=6.08+3.1*ex+lift;ty=3.04+.55*ex+lift/2;
  const dd=dist*Math.max(1,(H+1.2)/7.3);
  camera.position.set(dd*Math.sin(yaw)*Math.cos(pitch),ty+dd*Math.sin(pitch),dd*Math.cos(yaw)*Math.cos(pitch));
  camera.lookAt(0,ty,0);
  renderer.render(scene,camera);
  labels();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
</body>
